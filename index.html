<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>트라이나 - 일상을 한결 가볍게</title>
    <!--
      구글 로그인(GIS) 스크립트는 여기서 미리 받아둔다.
      로그인 버튼을 누른 뒤에 받으면 클릭과 팝업 사이에 다운로드 왕복이 끼는데,
      브라우저는 클릭 직후 짧은 시간에 열리는 팝업만 허용하므로(특히 사파리는
      사실상 동기 실행만 인정) 그 왕복 때문에 팝업이 차단된다.
      id는 utils/googleAuth.ts의 GIS_SCRIPT_ID와 같아야 스크립트가 두 번 붙지 않는다.
    -->
    <script
      id="google-identity-services"
      src="https://accounts.google.com/gsi/client"
      async
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
